<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création de compte</title>
    <link href="./style.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="register.js" defer></script>
</head>
<body>

    <div class="login">
        <h2>Création d'un compte Pixela</h2>

        <form id="pixelaForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur (lettres minuscules, chiffres et tirets) :</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="token">Mot de passe (8-128 caractères) :</label>
                <input type="password" id="token" required>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    J'accepte les conditions d'utilisation
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="notMinor" required>
                    Je confirme être majeur ou avoir le consentement parental
                </label>
            </div>

            <button type="submit" class="btn">Créer le compte</button>
        </form>

        <a href="./login/login.html">
            <button type="button" class="register">J'ai déjà un compte</button>
        </a>

        <div id="result"></div>
    </div>

</body>
</html>
